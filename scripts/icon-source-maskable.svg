<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="coin" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#241340"/>
      <stop offset="55%" stop-color="#130a24"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c4b1fc"/>
    </linearGradient>
    <linearGradient id="ringB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#c8fbff"/>
    </linearGradient>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spark" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#coin)"/>
  <circle cx="256" cy="256" r="250" fill="none" stroke="rgba(167,139,250,0.35)" stroke-width="2"/>
  <g filter="url(#bloom)">
    <circle cx="219.65" cy="256" r="78.51599999999999" fill="none" stroke="url(#ringA)" stroke-width="21.81"/>
    <circle cx="292.35" cy="256" r="78.51599999999999" fill="none" stroke="url(#ringB)" stroke-width="21.81"/>
    <circle cx="256" cy="186.40517435900858" r="9.451" fill="#f7f3ff" filter="url(#spark)"/>
    <circle cx="256" cy="325.5948256409914" r="9.451" fill="#f0abfc" filter="url(#spark)"/>
    <circle cx="256" cy="186.40517435900858" r="5.19805" fill="#ffffff"/>
    <circle cx="256" cy="325.5948256409914" r="5.19805" fill="#ffffff"/>
  </g>
</svg>
